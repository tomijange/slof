# Short smoke test of the whole oxn pipeline: deploy, inject a treatment under load, record responses, tear down.
# The load phase is only 6 minutes, so use it to check a cluster or a code change before a full experiment.
#
# SUE: OpenTelemetry Demo (chart 0.42.6) in system-under-evaluation, Jaeger keeps traces in memory.
# Prometheus and Kepler are not part of the deployment, run `oxn setup` first.
#
# During the load:
#   - 45ms +- 45ms of network delay on the recommendation pod (eth0) for 1m.
# The commented-out treatments below are ready-made examples of the other treatment types.
#
# Load: Locust inside the cluster, 500 users spawned at 10/s against frontend-proxy, for 6m.
# Responses: frontend and recommendation traces from Jaeger, CPU, Kepler energy and network bytes of the
# recommendation pod, CPU and Kepler energy of the whole SUE, frontend p95 latency, recommendations served
# and sampled traces.
experiment:
  version: 0.0.1
  orchestrator: kubernetes
  deployment:
    namespaces:
      - name: system-under-evaluation
    steps:
      - helm:
          release: astronomy-shop
          chart: opentelemetry-demo
          repo: https://open-telemetry.github.io/opentelemetry-helm-charts
          version: 0.42.6
          namespace: system-under-evaluation
          values: [deployments/values/values_opentelemetry_demo.yaml]
  services:
    jaeger:
      name: jaeger
      namespace: system-under-evaluation
    prometheus:
      [
        { name: prometheus, namespace: system-under-evaluation, target: sue },
        {
          name: kube-prometheus-kube-prome-prometheus,
          namespace: oxn-external-monitoring,
          target: oxn,
        },
      ]
  responses:
    - frontend_traces:
        type: trace
        service_name: frontend
        left_window: 30s
        right_window: 30s
        limit: 10000
    - recommendation_traces:
        type: trace
        service_name: recommendation
        left_window: 30s
        right_window: 30s
        limit: 10000
    - system_CPU:
        type: metric
        metric_name: sum(rate(container_cpu_usage_seconds_total{service="kube-prometheus-kube-prome-kubelet", namespace="system-under-evaluation"}[1m]))
        left_window: 30s
        right_window: 30s
        step: 1
        target: oxn
    - recommendation_deployment_CPU:
        type: metric
        metric_name: sum(rate(container_cpu_usage_seconds_total{service="kube-prometheus-kube-prome-kubelet", namespace="system-under-evaluation", pod=~"recommendation.*"}[90s])) by (pod)
        left_window: 30s
        right_window: 30s
        step: 1
        target: oxn
    - recommendation_kepler_package_joules:
        type: metric
        metric_name: sum by (pod_name, pod_namespace) (irate(kepler_pod_cpu_joules_total{zone="package", pod_namespace=~"system-under-evaluation", pod_name=~"recommendation.*"}[1m]))
        left_window: 30s
        right_window: 30s
        step: 1
        target: oxn
    - recommendation_kepler_dram_joules:
        type: metric
        metric_name: sum by (pod_name, pod_namespace) (irate(kepler_pod_cpu_joules_total{zone="dram", pod_namespace=~"system-under-evaluation", pod_name=~"recommendation.*"}[1m]))
        left_window: 30s
        right_window: 30s
        step: 1
        target: oxn
    - latency_frontend_95_percentile:
        type: metric
        metric_name: histogram_quantile(0.95, sum(rate(http_client_request_duration_seconds_bucket{job="opentelemetry-demo/frontend"}[2m])) by (le))
        left_window: 30s
        right_window: 30s
        step: 1
        target: sue
    - recommendations_total:
        type: metric
        metric_name: increase(demo_recommendation_requests_total[2m])
        left_window: 30s
        right_window: 30s
        step: 1
        target: sue
    - sampling_rates:
        type: metric
        metric_name: increase(otelcol_processor_probabilistic_sampler_count_traces_sampled_total[90s])
        left_window: 30s
        right_window: 30s
        step: 1
        target: sue
    - kepler_metric_all_namespace:
        type: metric
        metric_name: sum by (pod_name, container_name, pod_namespace, node_name) (irate(kepler_container_cpu_joules_total{zone=~"package|dram"}[1m]) * on(pod_id) group_left(pod_namespace, pod_name) group by (pod_id, pod_namespace, pod_name) (kepler_pod_cpu_joules_total{pod_namespace="system-under-evaluation"}))
        left_window: 30s
        right_window: 30s
        step: 1
        target: oxn
    - cadvisor_network_bytes_transmitted:
        type: metric
        metric_name: sum by (pod, namespace) (rate(container_network_transmit_bytes_total{service="kube-prometheus-kube-prome-kubelet", namespace="system-under-evaluation", pod=~"recommendation.*"}[1m]))
        left_window: 30s
        right_window: 30s
        step: 1
        target: oxn
  treatments:
    # - kill_recommendation_service:
    #    action: kubernetes_kill
    #    params: {
    #      namespace: system-under-evaluation,
    #      label_selector: app.kubernetes.io/component,
    #      label: recommendation,
    #      amount_to_kill: 1,
    #    }
    # - stop_loadgen_deployment:
    #    action: scale_deployment
    #    params: {
    #      namespace: system-under-evaluation,
    #      label_selector: app.kubernetes.io/component,
    #      label: loadgenerator,
    #      scale_to: 0,
    #    }
    # - add_security_context:
    #    action: security_context_kubernetes
    #    params: {
    #      namespace: system-under-evaluation,
    #      label_selector: app.kubernetes.io/component,
    #      label: recommendation,
    #      capabilities: { add: ["NET_ADMIN"] },
    #    }
    - delay_treatment:
        action: delay
        params: {
          namespace: system-under-evaluation,
          label_selector: app.kubernetes.io/name,
          label: recommendation,
          # service_name: node-exporter,
          delay_time: 45ms,
          delay_jitter: 45ms,
          duration: 1m,
          interface: eth0,
        }
    # - probabilistic_head_sampling_rate:
    #     action: kube_probl
    #     params: {
    #       sampling_percentage: 5.0,
    #       hash_seed: 22,
    #       }
    # - package_lost_treatment:
    #    action: kubernetes_loss
    #    params: {
    #      namespace: system-under-evaluation,
    #      label_selector: app.kubernetes.io/name,
    #      label: recommendation,
    #      loss_percentage: 15.0,
    #      duration: 10m,
    #      interface: eth0,
    #    }
    # - empty_treatment:
    #     action: empty
    #     params: {
    #       duration: 60m,
    #     }
    # - increase_otel_metric_interval:
    #    action: kubernetes_otel_metrics_interval
    #    params: {
    #      namespace: system-under-evaluation,
    #      label_selector: app.kubernetes.io/component,
    #      label: recommendation,
    #      interval: 15s,
    #    }
    # reloading the prometheus config is not as trivial as it seems to be
    # - prometheus_scrape_interval:
    #    action: kubernetes_prometheus_interval
    #    params: {
    #      interval: 5s,
    #      evaluation_interval: 5s,
    #      scrape_timeout: 3s,
    #    }
  sue:
    exclude: [loadgenerator]
    required: [{ namespace: system-under-evaluation, name: prometheus }]  # {namespace: monitoring, name: not-running-service}
    # required: [{namespace: monitoring, name: grafana}, {namespace: monitoring, name: node-exporter}]
  loadgen:
    run_time: 6m
    max_users: 500
    spawn_rate: 10
    locust_files:
      [
        { path: locust/locust_basic_interaction.py },
        { path: locust/locust_otel_demo.py },
      ]
    target:
      name: frontend-proxy
      namespace: system-under-evaluation
      port: 8080
