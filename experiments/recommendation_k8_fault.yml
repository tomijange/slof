# yaml-language-server: $schema=../schema.json
# Network delay on the recommendation service x telemetry settings, with traces in memory.
# Replaces recommendation_k8_delay_{5_percent,10_percent,1m_otel,1s_otel}.yml.
#
# SUE: OpenTelemetry Demo (chart 0.42.6) in system-under-evaluation.
# Prometheus and Kepler are not part of the deployment, run `oxn setup` first.
# Jaeger keeps traces in memory.
#
# Matrix: 2 faults x 4 telemetry settings = 8 variants.
#   - fault: none, the reference point, or 45ms +- 45ms of network delay on the recommendation pod (eth0).
#   - telemetry: the defaults of the demo (1 % sampling, metric export every 60s), head sampling at 5 % or 10 %
#     (hash seed 22), or metric export every 1s for the recommendation service.
#
# Before the load starts:
#   - The treatments of the telemetry setting, none for defaults.
# During the load:
#   - The fault for 60m: an empty treatment for none, the delay for delay.
#
# Load: Locust inside the cluster, 500 users spawned at 50/s against frontend-proxy, for 70m, in every variant.
# Responses: frontend and recommendation traces from Jaeger, up to 30000 each, CPU, Kepler energy (package and
# DRAM), network and storage I/O of the SUE, frontend p95 latency, recommendations served, sampled traces and
# Prometheus samples ingested.
# The storage responses filter on device /dev/md2, the disk of the ISE cluster node.
matrix:
  fault:
    none:
      treatment:
        empty_treatment:
          action: empty
          params:
            duration: 60m
    delay:
      treatment:
        delay_treatment:
          action: delay
          params:
            namespace: system-under-evaluation
            label_selector: app.kubernetes.io/name
            label: recommendation
            delay_time: 45ms
            delay_jitter: 45ms
            duration: 60m
            interface: eth0
  telemetry:
    defaults:
      treatments: []
    sampling_5:
      treatments:
        - probabilistic_head_sampling_rate:
            action: kube_probl
            params:
              sampling_percentage: 5.0
              hash_seed: 22
    sampling_10:
      treatments:
        - probabilistic_head_sampling_rate:
            action: kube_probl
            params:
              sampling_percentage: 10.0
              hash_seed: 22
    export_1s:
      treatments:
        - ensure_otel_metric_interval:
            action: kubernetes_otel_metrics_interval
            params:
              namespace: system-under-evaluation
              label_selector: app.kubernetes.io/component
              label: recommendation
              interval: 1s
experiment:
  version: 0.0.1
  orchestrator: kubernetes
  deployment:
    namespaces:
      - name: system-under-evaluation
    steps:
      - helm:
          release: astronomy-shop
          chart: opentelemetry-demo
          repo: https://open-telemetry.github.io/opentelemetry-helm-charts
          version: 0.42.6
          namespace: system-under-evaluation
          values: [deployments/values/values_opentelemetry_demo.yaml]
  services:
    jaeger:
      name: jaeger
      namespace: system-under-evaluation
    grafana:
      name: kube-prometheus-grafana
      namespace: oxn-external-monitoring
    prometheus:
      - {name: prometheus, namespace: system-under-evaluation, target: sue}
      - {name: kube-prometheus-kube-prome-prometheus, namespace: oxn-external-monitoring, target: oxn}
  responses:
    - frontend_traces:
        type: trace
        service_name: frontend
        left_window: 420s
        right_window: 120s
        limit: 30000
    - recommendation_traces:
        type: trace
        service_name: recommendation
        left_window: 420s
        right_window: 120s
        limit: 30000
    - system_CPU:
        type: metric
        metric_name: sum(rate(container_cpu_usage_seconds_total{service="kube-prometheus-kube-prome-kubelet", namespace="system-under-evaluation"}[1m]))
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - recommendation_deployment_CPU:
        type: metric
        metric_name: sum(rate(container_cpu_usage_seconds_total{service="kube-prometheus-kube-prome-kubelet", namespace="system-under-evaluation", pod=~"recommendation.*"}[90s])) by (pod)
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - recommendation_kepler_package_joules:
        type: metric
        metric_name: sum by (pod_name, container_namespace) (label_replace(rate(kepler_pod_cpu_joules_total{zone="package", pod_namespace=~"system-under-evaluation", pod_name=~"recommendation.*"}[90s]), "container_namespace", "$1", "pod_namespace", "(.*)"))
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - recommendation_kepler_dram_joules:
        type: metric
        metric_name: sum by (pod_name, container_namespace) (label_replace(rate(kepler_pod_cpu_joules_total{zone="dram", pod_namespace=~"system-under-evaluation", pod_name=~"recommendation.*"}[90s]), "container_namespace", "$1", "pod_namespace", "(.*)"))
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - pods_kepler_package_joules_all:
        type: metric
        metric_name: sum by (container_name, container_namespace) (label_replace(rate(kepler_container_cpu_joules_total{zone="package"}[90s]) * on(pod_id) group_left(pod_namespace) group by (pod_id, pod_namespace) (kepler_pod_cpu_joules_total{pod_namespace=~"system-under-evaluation"}), "container_namespace", "$1", "pod_namespace", "(.*)"))
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - pods_kepler_dram_joules_all:
        type: metric
        metric_name: sum by (container_name, container_namespace) (label_replace(rate(kepler_container_cpu_joules_total{zone="dram"}[90s]) * on(pod_id) group_left(pod_namespace) group by (pod_id, pod_namespace) (kepler_pod_cpu_joules_total{pod_namespace=~"system-under-evaluation"}), "container_namespace", "$1", "pod_namespace", "(.*)"))
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - pods_kepler_joules_all:
        type: metric
        metric_name: sum by (container_name, container_namespace) (label_replace(rate(kepler_container_cpu_joules_total{zone=~"package|dram"}[90s]) * on(pod_id) group_left(pod_namespace) group by (pod_id, pod_namespace) (kepler_pod_cpu_joules_total{pod_namespace=~"system-under-evaluation"}), "container_namespace", "$1", "pod_namespace", "(.*)"))
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - pods_kepler_package_joules_all_absolute:
        type: metric
        metric_name: sum by (container_name, container_namespace) (label_replace(kepler_container_cpu_joules_total{zone="package"} * on(pod_id) group_left(pod_namespace) group by (pod_id, pod_namespace) (kepler_pod_cpu_joules_total{pod_namespace=~"system-under-evaluation"}), "container_namespace", "$1", "pod_namespace", "(.*)"))
        left_window: 420s
        right_window: 120s
        step: 30
