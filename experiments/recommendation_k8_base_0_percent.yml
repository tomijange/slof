# Trace sampling at 0 %: the collector drops every trace. Reference point for the cost of tracing.
#
# SUE: OpenTelemetry Demo (chart 0.42.6) in system-under-evaluation, Jaeger keeps traces in memory.
# Prometheus and Kepler are not part of the deployment, run `oxn setup` first.
#
# Before the load starts:
#   - The collector samples 0 % of traces (probabilistic head sampling, hash seed 22).
#   - The SUE's Prometheus scrapes every 60s (timeout 3s, rule evaluation every 30s).
# During the load:
#   - An empty treatment observes the SUE for 60m.
#
# Load: Locust inside the cluster, 500 users spawned at 50/s against frontend-proxy, for 70m.
# Responses: CPU, Kepler energy (package and DRAM), network and storage I/O of the SUE, frontend p95 latency,
# recommendations served, sampled traces and Prometheus samples ingested.
# The storage responses filter on device /dev/md2, the disk of the ISE cluster node.
experiment:
  version: 0.0.1
  orchestrator: kubernetes
  deployment:
    namespaces:
      - name: system-under-evaluation
    steps:
      - helm:
          release: astronomy-shop
          chart: opentelemetry-demo
          repo: https://open-telemetry.github.io/opentelemetry-helm-charts
          version: 0.42.6
          namespace: system-under-evaluation
          values: [deployments/values/values_opentelemetry_demo.yaml]
  services:
    jaeger:
      name: jaeger
      namespace: system-under-evaluation
    prometheus:
      - {name: prometheus, namespace: system-under-evaluation, target: sue}
      - {name: kube-prometheus-kube-prome-prometheus, namespace: oxn-external-monitoring, target: oxn}
  responses:
    - system_CPU:
        type: metric
        metric_name: sum(rate(container_cpu_usage_seconds_total{service="kube-prometheus-kube-prome-kubelet", namespace="system-under-evaluation"}[1m]))
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - recommendation_deployment_CPU:
        type: metric
        metric_name: sum(rate(container_cpu_usage_seconds_total{service="kube-prometheus-kube-prome-kubelet", namespace="system-under-evaluation", pod=~"recommendation.*"}[90s])) by (pod)
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - recommendation_kepler_package_joules:
        type: metric
        metric_name: sum by (pod_name, container_namespace) (label_replace(rate(kepler_pod_cpu_joules_total{zone="package", pod_namespace=~"system-under-evaluation", pod_name=~"recommendation.*"}[90s]), "container_namespace", "$1", "pod_namespace", "(.*)"))
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - recommendation_kepler_dram_joules:
        type: metric
        metric_name: sum by (pod_name, container_namespace) (label_replace(rate(kepler_pod_cpu_joules_total{zone="dram", pod_namespace=~"system-under-evaluation", pod_name=~"recommendation.*"}[90s]), "container_namespace", "$1", "pod_namespace", "(.*)"))
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - pods_kepler_package_joules_all:
        type: metric
        metric_name: sum by (container_name, container_namespace) (label_replace(rate(kepler_container_cpu_joules_total{zone="package"}[90s]) * on(pod_id) group_left(pod_namespace) group by (pod_id, pod_namespace) (kepler_pod_cpu_joules_total{pod_namespace=~"system-under-evaluation"}), "container_namespace", "$1", "pod_namespace", "(.*)"))
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - pods_kepler_dram_joules_all:
        type: metric
        metric_name: sum by (container_name, container_namespace) (label_replace(rate(kepler_container_cpu_joules_total{zone="dram"}[90s]) * on(pod_id) group_left(pod_namespace) group by (pod_id, pod_namespace) (kepler_pod_cpu_joules_total{pod_namespace=~"system-under-evaluation"}), "container_namespace", "$1", "pod_namespace", "(.*)"))
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - pods_kepler_joules_all:
        type: metric
        metric_name: sum by (container_name, container_namespace) (label_replace(rate(kepler_container_cpu_joules_total{zone=~"package|dram"}[90s]) * on(pod_id) group_left(pod_namespace) group by (pod_id, pod_namespace) (kepler_pod_cpu_joules_total{pod_namespace=~"system-under-evaluation"}), "container_namespace", "$1", "pod_namespace", "(.*)"))
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - pods_kepler_package_joules_all_absolute:
        type: metric
        metric_name: sum by (container_name, container_namespace) (label_replace(kepler_container_cpu_joules_total{zone="package"} * on(pod_id) group_left(pod_namespace) group by (pod_id, pod_namespace) (kepler_pod_cpu_joules_total{pod_namespace=~"system-under-evaluation"}), "container_namespace", "$1", "pod_namespace", "(.*)"))
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - pods_kepler_dram_joules_all_absolute:
        type: metric
        metric_name: sum by (container_name, container_namespace) (label_replace(kepler_container_cpu_joules_total{zone="dram"} * on(pod_id) group_left(pod_namespace) group by (pod_id, pod_namespace) (kepler_pod_cpu_joules_total{pod_namespace=~"system-under-evaluation"}), "container_namespace", "$1", "pod_namespace", "(.*)"))
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - pods_kepler_joules_all_absolute:
        type: metric
        metric_name: sum by (container_name, container_namespace) (label_replace(kepler_container_cpu_joules_total{zone=~"package|dram"} * on(pod_id) group_left(pod_namespace) group by (pod_id, pod_namespace) (kepler_pod_cpu_joules_total{pod_namespace=~"system-under-evaluation"}), "container_namespace", "$1", "pod_namespace", "(.*)"))
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - kepler_package_joules_namespace_combined:
        type: metric
        metric_name: sum by (container_namespace) (label_replace(rate(kepler_pod_cpu_joules_total{zone="package", pod_namespace=~"system-under-evaluation"}[90s]), "container_namespace", "$1", "pod_namespace", "(.*)"))
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - kepler_dram_joules_namespace_combined:
        type: metric
        metric_name: sum by (container_namespace) (label_replace(rate(kepler_pod_cpu_joules_total{zone="dram", pod_namespace=~"system-under-evaluation"}[90s]), "container_namespace", "$1", "pod_namespace", "(.*)"))
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - kepler_joules_namespace_combined:
        type: metric
        metric_name: sum by (container_namespace) (label_replace(rate(kepler_pod_cpu_joules_total{zone=~"package|dram", pod_namespace=~"system-under-evaluation"}[90s]), "container_namespace", "$1", "pod_namespace", "(.*)"))
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - kepler_package_joules_namespace_combined_absolute:
        type: metric
        metric_name: sum by (container_namespace) (label_replace(kepler_pod_cpu_joules_total{zone="package", pod_namespace=~"system-under-evaluation"}, "container_namespace", "$1", "pod_namespace", "(.*)"))
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - kepler_dram_joules_namespace_combined_absolute:
        type: metric
        metric_name: sum by (container_namespace) (label_replace(kepler_pod_cpu_joules_total{zone="dram", pod_namespace=~"system-under-evaluation"}, "container_namespace", "$1", "pod_namespace", "(.*)"))
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - kepler_joules_namespace_combined_absolute:
        type: metric
        metric_name: sum by (container_namespace) (label_replace(kepler_pod_cpu_joules_total{zone=~"package|dram", pod_namespace=~"system-under-evaluation"}, "container_namespace", "$1", "pod_namespace", "(.*)"))
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - latency_frontend_95_percentile:
        type: metric
        metric_name: histogram_quantile(0.95, sum(rate(http_client_request_duration_seconds_bucket{job="opentelemetry-demo/frontend"}[90s])) by (le))
        left_window: 420s
        right_window: 120s
        step: 30
        target: sue
    - recommendations_total:
        type: metric
        metric_name: increase(demo_recommendation_requests_total[3m])
        left_window: 420s
        right_window: 120s
        step: 30
        target: sue
    - sampling_rates:
        type: metric
        metric_name: increase(otelcol_processor_probabilistic_sampler_count_traces_sampled_total[90s])
        left_window: 420s
        right_window: 120s
        step: 30
        target: sue
    - kepler_joules_total_namespace_combined:
        type: metric
        metric_name: sum by (container_namespace) (label_replace(rate(kepler_pod_cpu_joules_total{zone=~"package|dram", pod_namespace=~"system-under-evaluation"}[90s]), "container_namespace", "$1", "pod_namespace", "(.*)"))
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - kepler_metric_all_namespace:
        type: metric
        metric_name: sum by (pod_name, container_name, container_namespace, node) (label_replace(label_replace(rate(kepler_container_cpu_joules_total{zone=~"package|dram"}[90s]) * on(pod_id) group_left(pod_name, pod_namespace) group by (pod_id, pod_name, pod_namespace) (kepler_pod_cpu_joules_total{pod_namespace=~"system-under-evaluation"}), "container_namespace", "$1", "pod_namespace", "(.*)"), "node", "$1", "node_name", "(.*)"))
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - cadvisor_network_bytes_transmitted:
        type: metric
        metric_name: sum by (label_app_kubernetes_io_name,namespace)(rate(container_network_transmit_bytes_total{service="kube-prometheus-kube-prome-kubelet"}[90s])* on(pod, namespace)group_left(label_app_kubernetes_io_name) kube_pod_labels{label_app_kubernetes_io_name="recommendation", namespace="system-under-evaluation"})
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - cadvisor_network_bytes_transmitted_aboslute:
        type: metric
        metric_name: sum by (label_app_kubernetes_io_name,namespace)(container_network_transmit_bytes_total{service="kube-prometheus-kube-prome-kubelet"} * on(pod, namespace)group_left(label_app_kubernetes_io_name) kube_pod_labels{label_app_kubernetes_io_name="recommendation", namespace="system-under-evaluation"})
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - cadvisor_network_bytes_transmitted_all:
        type: metric
        metric_name: sum by (label_app_kubernetes_io_name,namespace)(rate(container_network_transmit_bytes_total{service="kube-prometheus-kube-prome-kubelet"}[90s])* on(pod, namespace)group_left(label_app_kubernetes_io_name) kube_pod_labels{namespace="system-under-evaluation"})
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - cadvisor_network_bytes_received_all:
        type: metric
        metric_name: sum by (label_app_kubernetes_io_name,namespace)(rate(container_network_receive_bytes_total{service="kube-prometheus-kube-prome-kubelet"}[90s])* on(pod, namespace)group_left(label_app_kubernetes_io_name) kube_pod_labels{namespace="system-under-evaluation"})
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - cadvisor_network_bytes_transmitted_all_absolute:
        type: metric
        metric_name: sum by (component, namespace, label_app_kubernetes_io_name) (label_replace(container_network_transmit_bytes_total{service="kube-prometheus-kube-prome-kubelet"}, "component", "$1","pod", "^(.*)-[a-z0-9]+-[a-z0-9]+$")* on(pod, namespace) group_left(label_app_kubernetes_io_name) kube_pod_labels{namespace="system-under-evaluation"})
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - cadvisor_network_bytes_received_all_absolute:
        type: metric
        metric_name: sum by (component, namespace, label_app_kubernetes_io_name) (label_replace(container_network_receive_bytes_total{service="kube-prometheus-kube-prome-kubelet"}, "component", "$1","pod", "^(.*)-[a-z0-9]+-[a-z0-9]+$")* on(pod, namespace) group_left(label_app_kubernetes_io_name) kube_pod_labels{namespace="system-under-evaluation"})
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - cadvisor_network_bytes_transmitted_combined_absolute:
        type: metric
        metric_name: sum by (namespace)(container_network_transmit_bytes_total{service="kube-prometheus-kube-prome-kubelet"} * on(pod, namespace)group_left(label_app_kubernetes_io_name) kube_pod_labels{namespace="system-under-evaluation"})
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - cadvisor_network_bytes_transmitted_combined:
        type: metric
        metric_name: sum by (namespace)(rate(container_network_transmit_bytes_total{service="kube-prometheus-kube-prome-kubelet"}[90s])* on(pod, namespace)group_left(label_app_kubernetes_io_name) kube_pod_labels{namespace="system-under-evaluation"})
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - cadvisor_network_bytes_received_combined_absolute:
        type: metric
        metric_name: sum by (namespace)(container_network_receive_bytes_total{service="kube-prometheus-kube-prome-kubelet"} * on(pod, namespace)group_left(label_app_kubernetes_io_name) kube_pod_labels{namespace="system-under-evaluation"})
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - cadvisor_network_bytes_received_combined:
        type: metric
        metric_name: sum by (namespace)(rate(container_network_receive_bytes_total{service="kube-prometheus-kube-prome-kubelet"}[90s])* on(pod, namespace)group_left(label_app_kubernetes_io_name) kube_pod_labels{namespace="system-under-evaluation"})
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - cadvisor_storage_usage_all:
        type: metric
        metric_name: sum by (label_app_kubernetes_io_name,namespace)(rate(container_blkio_device_usage_total{device="/dev/md2",service="kube-prometheus-kube-prome-kubelet"}[3m])* on(pod, namespace)group_left(label_app_kubernetes_io_name) kube_pod_labels{namespace="system-under-evaluation"})
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - cadvisor_storage_usage_combined:
        type: metric
        metric_name: sum by (namespace)(rate(container_blkio_device_usage_total{device="/dev/md2",service="kube-prometheus-kube-prome-kubelet"}[3m])* on(pod, namespace)group_left(label_app_kubernetes_io_name) kube_pod_labels{namespace="system-under-evaluation"})
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - cadvisor_storage_usage_all_absolute:
        type: metric
        metric_name: sum by (label_app_kubernetes_io_name,namespace)(container_blkio_device_usage_total{device="/dev/md2",service="kube-prometheus-kube-prome-kubelet"} * on(pod, namespace)group_left(label_app_kubernetes_io_name) kube_pod_labels{namespace="system-under-evaluation"})
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - cadvisor_storage_usage_combined_absolute:
        type: metric
        metric_name: sum by (namespace)(container_blkio_device_usage_total{device="/dev/md2",service="kube-prometheus-kube-prome-kubelet"} * on(pod, namespace)group_left(label_app_kubernetes_io_name) kube_pod_labels{namespace="system-under-evaluation"})
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - pods_kepler_package_joules_all_absolute_all_namespaces:
        type: metric
        metric_name: sum by (container_name, container_namespace) (label_replace(kepler_container_cpu_joules_total{zone="package"} * on(pod_id) group_left(pod_namespace) group by (pod_id, pod_namespace) (kepler_pod_cpu_joules_total), "container_namespace", "$1", "pod_namespace", "(.*)"))
        left_window: 30s
        right_window: 30s
        step: 30
        target: oxn
    - pods_kepler_joules_all_absolute_all_namespaces:
        type: metric
        metric_name: sum by (container_name, container_namespace) (label_replace(kepler_container_cpu_joules_total{zone=~"package|dram"} * on(pod_id) group_left(pod_namespace) group by (pod_id, pod_namespace) (kepler_pod_cpu_joules_total), "container_namespace", "$1", "pod_namespace", "(.*)"))
        left_window: 30s
        right_window: 30s
        step: 30
        target: oxn
    - pods_kepler_dram_joules_all_absolute_all_namespaces:
        type: metric
        metric_name: sum by (container_name, container_namespace) (label_replace(kepler_container_cpu_joules_total{zone="dram"} * on(pod_id) group_left(pod_namespace) group by (pod_id, pod_namespace) (kepler_pod_cpu_joules_total), "container_namespace", "$1", "pod_namespace", "(.*)"))
        left_window: 30s
        right_window: 30s
        step: 30
        target: oxn
    - cadvisor_network_bytes_received_all_absolute_all_namespaces:
        type: metric
        metric_name: sum by (label_app_kubernetes_io_name,namespace)(container_network_receive_bytes_total * on(pod, namespace)group_left(label_app_kubernetes_io_name) kube_pod_labels{})
        left_window: 30s
        right_window: 30s
        step: 30
        target: oxn
    - cadvisor_storage_usage_all_absolute_all_namespaces:
        type: metric
        metric_name: sum by (label_app_kubernetes_io_name,namespace)(container_blkio_device_usage_total * on(pod, namespace)group_left(label_app_kubernetes_io_name) kube_pod_labels{})
        left_window: 30s
        right_window: 30s
        step: 30
        target: oxn
    - pods_kepler_joules_all_container_level:
        type: metric
        metric_name: sum by (label_app_kubernetes_io_name, namespace, container_name) (label_replace(kepler_container_cpu_joules_total{zone=~"package|dram"}, "uid", "$1", "pod_id", "(.*)") * on(uid) group_left(label_app_kubernetes_io_name, namespace) kube_pod_labels{label_app_kubernetes_io_name=~".+", namespace="system-under-evaluation"})
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - pods_kepler_joules_all_container_level_all_namespaces:
        type: metric
        metric_name: sum by (label_app_kubernetes_io_name, container_name, container_namespace) (label_replace(label_replace(kepler_container_cpu_joules_total{zone=~"package|dram"}, "uid", "$1", "pod_id", "(.*)") * on(uid) group_left(label_app_kubernetes_io_name, namespace) kube_pod_labels{label_app_kubernetes_io_name=~".+"}, "container_namespace", "$1", "namespace", "(.*)"))
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - prometheus_scrape_amount:
        type: metric
        metric_name: prometheus_tsdb_head_samples_appended_total
        left_window: 420s
        right_window: 120s
        step: 30
        target: sue
    - cadvisor_storage_usage_writes_all_absolute:
        type: metric
        metric_name: sum by (label_app_kubernetes_io_name,namespace)(container_blkio_device_usage_total{device="/dev/md2",service="kube-prometheus-kube-prome-kubelet", operation="Write"} * on(pod, namespace)group_left(label_app_kubernetes_io_name) kube_pod_labels{namespace="system-under-evaluation"})
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
  treatments:
    - probabilistic_head_sampling_rate:
        action: kube_probl
        params:
          sampling_percentage: 0.0
          hash_seed: 22
    - empty_treatment:
        action: empty
        params:
          duration: 60m
    - prometheus_scrape_interval:
        action: kubernetes_prometheus_interval
        params:
          interval: 60s
          evaluation_interval: 30s
          scrape_timeout: 3s
  sue:
    compose: opentelemetry-demo/docker-compose.yml
    exclude: [loadgenerator]
    required:
      - {namespace: system-under-evaluation, name: prometheus}
  loadgen:
    run_time: 70m
    max_users: 500
    spawn_rate: 50
    locust_files:
      - {path: locust/locust_basic_interaction.py}
      - {path: locust/locust_otel_demo.py}
    target:
      name: frontend-proxy
      namespace: system-under-evaluation
      port: 8080
