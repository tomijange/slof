# yaml-language-server: $schema=../schema.json
# Three settings, recording only cumulative energy, network and storage counters.
# Replaces recommendation_k8_base_{10_percent,50_percent,1s_otel}_minimal.yml.
#
# SUE: OpenTelemetry Demo (chart 0.42.6) in system-under-evaluation.
# Prometheus and Kepler are not part of the deployment, run `oxn setup` first.
# Jaeger keeps traces in memory.
#
# Matrix: 3 telemetry settings = 3 variants.
#   - telemetry: head sampling at 10 % or 50 % (hash seed 22), or metric export every 1s for the recommendation
#     service.
#
# Before the load starts:
#   - The treatment of the telemetry setting.
# During the load:
#   - An empty treatment observes the SUE for 60m.
#
# Load: Locust inside the cluster, 500 users spawned at 50/s against frontend-proxy, for 70m, in every variant.
# Responses: only three cumulative ones, Kepler energy per container, network bytes sent and storage I/O of
# the SUE.
matrix:
  telemetry:
    sampling_10:
      treatments:
        - probabilistic_head_sampling_rate:
            action: kube_probl
            params:
              sampling_percentage: 10.0
              hash_seed: 22
    sampling_50:
      treatments:
        - probabilistic_head_sampling_rate:
            action: kube_probl
            params:
              sampling_percentage: 50.0
              hash_seed: 22
    export_1s:
      treatments:
        - ensure_otel_metric_interval:
            action: kubernetes_otel_metrics_interval
            params:
              namespace: system-under-evaluation
              label_selector: app.kubernetes.io/component
              label: recommendation
              interval: 1s
experiment:
  version: 0.0.1
  orchestrator: kubernetes
  deployment:
    namespaces:
      - name: system-under-evaluation
    steps:
      - helm:
          release: astronomy-shop
          chart: opentelemetry-demo
          repo: https://open-telemetry.github.io/opentelemetry-helm-charts
          version: 0.42.6
          namespace: system-under-evaluation
          values: [deployments/values/values_opentelemetry_demo.yaml]
  services:
    jaeger:
      name: jaeger
      namespace: system-under-evaluation
    grafana:
      name: kube-prometheus-grafana
      namespace: oxn-external-monitoring
    prometheus:
      - {name: prometheus, namespace: system-under-evaluation, target: sue}
      - {name: kube-prometheus-kube-prome-prometheus, namespace: oxn-external-monitoring, target: oxn}
  responses:
    - pods_kepler_joules_all_absolute:
        type: metric
        metric_name: sum by (container_name, container_namespace) (label_replace(kepler_container_cpu_joules_total{zone=~"package|dram"} * on(pod_id) group_left(pod_namespace) group by (pod_id, pod_namespace) (kepler_pod_cpu_joules_total{pod_namespace=~"system-under-evaluation"}), "container_namespace", "$1", "pod_namespace", "(.*)"))
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - cadvisor_network_bytes_transmitted_all_absolute:
        type: metric
        metric_name: sum by (component, namespace, label_app_kubernetes_io_name) (label_replace(container_network_transmit_bytes_total{service="kube-prometheus-kube-prome-kubelet"}, "component", "$1","pod", "^(.*)-[a-z0-9]+-[a-z0-9]+$")* on(pod, namespace) group_left(label_app_kubernetes_io_name) kube_pod_labels{namespace="system-under-evaluation"})
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
    - cadvisor_storage_usage_all_absolute:
        type: metric
        metric_name: sum by (label_app_kubernetes_io_name,namespace)(container_blkio_device_usage_total * on(pod, namespace)group_left(label_app_kubernetes_io_name) kube_pod_labels{namespace="system-under-evaluation"})
        left_window: 420s
        right_window: 120s
        step: 30
        target: oxn
  treatments:
    - ${{ telemetry.treatments }}
    - empty_treatment:
        action: empty
        params:
          duration: 60m
  sue:
    exclude: [loadgenerator]
    required:
      - {namespace: system-under-evaluation, name: prometheus}
  loadgen:
    run_time: 70m
    max_users: 500
    spawn_rate: 50
    locust_files:
      - {path: locust/locust_basic_interaction.py}
      - {path: locust/locust_otel_demo.py}
    target:
      name: frontend-proxy
      namespace: system-under-evaluation
      port: 8080
