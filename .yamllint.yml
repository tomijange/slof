extends: default

ignore: |
  .venv/
  build/
  docs/_build/
  # Jinja templates that oxn renders before applying them, not valid YAML
  oxn/loadgen/kubernetes/configmap.yaml
  oxn/loadgen/kubernetes/master.yaml
  oxn/loadgen/kubernetes/worker.yaml
  # Copied from mosesliao/kubernetes-locust, kept as they were
  locust/kubernetes/master-deployment.yaml
  locust/kubernetes/slave-deployment.yaml
  locust/kubernetes/scripts-cm.yaml

rules:
  # Specs and values files are single documents without ---
  document-start: disable
  # PromQL queries in the specs do not wrap
  line-length: disable
  # Kubernetes manifests often do not indent lists under their key
  indentation:
    indent-sequences: consistent
  # Flow mappings in the specs are written { key: value }
  braces:
    max-spaces-inside: 1
  # Commented-out entries keep the indentation they would have
  comments-indentation: disable
  # on: in GitHub workflows is a key, not a boolean
  truthy:
    check-keys: false
