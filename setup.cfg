[metadata]
name = oxn
version = 0.0.1
license_files = LICENSE
author = Joshua Bauer and Julian Legler
description = Observability experiments engine
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
classifiers =
    Topic :: Software Development :: Fault Injection :: Sustainability :: Energy Efficiency :: Observability :: Microservices :: Distributed Systems
    License :: MIT License
    Operating System: :: OS Independent
    Programming Language :: Python
    Programming Language :: Python :: 3.10
    Intended Audience :: Developers

[options]
packages = find_namespace:
zip_safe = false
python_requires = >= 3.10
install_requires =
    konsole>=0.7.0
    kubernetes>=30.1.0
    matplotlib>=3.6.2
    numpy>=1.23.5
    pandas>=2.1.2 
    python-dateutil>=2.8.2
    PyYAML>=6.0
    requests>=2.28.1
    pydantic>=2.0
    gevent>=22.10.2
    locust>=2.14.2
    pytz>=2022.7.1
    scipy>=1.10.1
    tables>=3.8.0

[options.packages.find]
include = oxn*
exclude =
    examples
    reports
    tests
    configs

[options.package_data]
# Jinja templates of the Locust pods, see oxn/loadgen/locust_kubernetes.py
oxn.loadgen = kubernetes/*.yaml, kubernetes/*.py

[options.entry_points]
console_scripts =
    oxn = oxn.cli.main:main
