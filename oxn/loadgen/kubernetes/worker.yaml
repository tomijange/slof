apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-worker
  namespace: {{ namespace }}
  labels:
    role: locust-worker
    app: locust-worker
spec:
  replicas: {{ worker_replicas }}
  selector:
    matchLabels:
      role: locust-worker
      app: locust-worker
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        role: locust-worker
        app: locust-worker
    spec:
      containers:
      - name: worker
        image: {{ image }}
        args: ["--worker", "--master-host={{ master_host }}", "-f", "{{ locustfiles }}"]
        volumeMounts:
        - mountPath: /home/locust
          name: locust-scripts
      volumes:
      - name: locust-scripts
        configMap:
          name: scripts-cm
