opentelemetry-collector:
  # oxn's kube_probl treatment expects a Deployment with the ConfigMap otel-collector. The chart now defaults
  # to a DaemonSet that also collects host, kubelet and cluster metrics, which chart 0.36.4 did not do.
  mode: deployment
  presets:
    hostMetrics:
      enabled: false
    kubeletMetrics:
      enabled: false
    clusterMetrics:
      enabled: false
    annotationDiscovery:
      metrics:
        enabled: false
  config:
    processors:
      probabilistic_sampler:
        sampling_percentage: 1
        hash_seed: 22
    service:
      pipelines:
        traces:
          processors:
            [
              memory_limiter,
              resource_detection,
              resource,
              transform/sanitize_spans,
              gen_ai_normalizer,
              transform/redact_sensitive_data,
              redaction,
              batch,
              probabilistic_sampler,
            ]
  resources:
    limits:
      # memory: 18Gi
      memory: 8Gi
prometheus:
  server:
    extraArgs:
      web.enable-lifecycle: ""
    persistentVolume:
      enabled: true
      storageClass: "openebs-hostpath"
      accessModes:
        - ReadWriteOnce
      size: 16Gi
    resources:
      limits:
        memory: 6Gi
