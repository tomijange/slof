name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            setup.cfg
            requirements-dev.txt
      # ty resolves the imports against the installed dependencies
      - run: pip install -e . -r requirements-dev.txt
      - run: make lint
