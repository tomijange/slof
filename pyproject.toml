[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[tools.setuptools_scm]
write_to = "oxn/_version.py"
local_scheme = "no-local-version"


[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*.ipynb", "oxn/_version.py", "evaluation/"]

[tool.ruff.lint]
# Pyflakes, the pycodestyle errors and import sorting. Listed explicitly
# because Ruff's default selection grows between versions.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# gevent has to patch the standard library before anything else is imported
"oxn/__init__.py" = ["E402"]
"evaluation/evaluation.py" = ["E402"]

[tool.ty.environment]
# The oldest version setup.cfg supports, as for Ruff
python-version = "3.10"

[tool.ty.src]
# The evaluation scripts and notebooks need packages that neither
# setup.cfg nor requirements-dev.txt installs
include = ["oxn", "locust"]
